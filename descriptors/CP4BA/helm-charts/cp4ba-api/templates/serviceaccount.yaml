{{- if .Values.serviceAccount.create }}
{{- include "cp4ba-api.validateRequiredValues" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cp4ba-api.serviceAccountName" . }}
  labels:
    {{- include "cp4ba-api.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
# Role for namespace-scoped operations (within operand namespace)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cp4ba-api.fullname" . }}-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp4ba-api.labels" . | nindent 4 }}
rules:
# Pod operations
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]

# Service operations
# delete included as it is required for the EDB to CNPG migration
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "delete"]

# ConfigMap and Secret operations
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]

# Deployment operations
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch", "update", "patch"]

# Custom Resource operations (CP4BA) - CRITICAL: Added create, update, patch for applyCR endpoint
- apiGroups: ["icp4a.ibm.com"]
  resources: ["icp4aclusters", "contents", "workflows", "cartridges", "bastudios", "processmining", "insights", "odms", "ads", "fncms", "bans", "ums", "insightsengines", "foundations", "foundationrequests", "wfpsruntimes", "processfederationservers"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]

# NetworkPolicy operations (needed for network policy management during upgrade)
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Custom Resource status subresource (for status updates if needed)
- apiGroups: ["icp4a.ibm.com"]
  resources: ["icp4aclusters/status", "contents/status", "workflows/status"]
  verbs: ["get", "update", "patch"]

# BAI InsightsEngine operations
- apiGroups: ["bai.ibm.com"]
  resources: ["insightsengines"]
  verbs: ["get", "list", "watch"]

# FNCM operations
- apiGroups: ["fncm.ibm.com"]
  resources: ["fncmclusters"]
  verbs: ["get", "list", "watch"]

# Common Services operations
- apiGroups: ["operator.ibm.com"]
  resources: ["commonservices"]
  verbs: ["get", "list", "watch"]

# Zen Services operations
- apiGroups: ["zen.cpd.ibm.com"]
  resources: ["zenservices"]
  verbs: ["get", "list", "watch"]

# Deployment scale operations (for scaling functionality)
- apiGroups: ["apps"]
  resources: ["deployments/scale", "statefulsets/scale"]
  verbs: ["get", "update", "patch"]

# OpenShift Project operations (needed for OpenShift environments)
- apiGroups: ["project.openshift.io"]
  resources: ["projects"]
  verbs: ["get", "list"]

# EDB to CNPG Migration - EDB Cluster operations
- apiGroups: ["postgresql.k8s.enterprisedb.io"]
  resources: ["clusters"]
  verbs: ["get", "list", "watch", "delete"]

# EDB to CNPG Migration - IBM CloudNativePG Cluster operations
- apiGroups: ["pg.ibm.com"]
  resources: ["clusters"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]

# EDB to CNPG Migration - PVC cleanup
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "delete"]

# Zen Extension operations (Used only for retrieving the internal URL for savepoint creation)
- apiGroups: ["zen.cpd.ibm.com"]
  resources: ["zenextensions"]
  verbs: ["get", "list"]
---
# RoleBinding for namespace-scoped operations
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cp4ba-api.fullname" . }}-binding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp4ba-api.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "cp4ba-api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "cp4ba-api.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}

{{- if .Values.serviceAccount.create  }}
---

# ClusterRole for cluster-scoped resources (requires ClusterRoleBinding)
# MINIMIZED: Only truly cluster-scoped resources that cannot be accessed via namespace-scoped RoleBindings
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cp4ba-api.fullname" . }}-cluster-scoped-role
  labels:
    {{- include "cp4ba-api.labels" . | nindent 4 }}
rules:
# PackageManifest operations (cluster-scoped resource - required for CPFS upgrade validation)
- apiGroups: ["packages.operators.coreos.com"]
  resources: ["packagemanifests"]
  verbs: ["get", "list", "watch"]
  
# CustomResourceDefinition operations (cluster-scoped resource - required for CRD checks)
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]

# Namespace operations (cluster-scoped resource - required for namespace validation)
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]

# Deployment operations (cluster-wide listing - required for CPFS migration checks across all namespaces)
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]

# Subscription operations (cluster-wide listing - required for CPFS operator detection across all namespaces)
- apiGroups: ["operators.coreos.com"]
  resources: ["subscriptions"]
  verbs: ["get", "list", "watch"]

# ClusterServiceVersion operations (cluster-wide listing - required for CPFS delegation checks)
- apiGroups: ["operators.coreos.com"]
  resources: ["clusterserviceversions"]
  verbs: ["get", "list", "watch"]

# CertManagerConfig operations (cluster-scoped - required for license acceptance when namespace is empty)
- apiGroups: ["operator.ibm.com"]
  resources: ["certmanagerconfigs"]
  verbs: ["get", "list", "watch", "patch"]

# IBMLicensing operations (cluster-scoped - required for CPFS LTSR migration checks and license acceptance)
# Used by: scripts/cpfs/installer_scripts/cp3pt0-deployment/setup_singleton.sh line 249, 479
- apiGroups: ["operator.ibm.com"]
  resources: ["ibmlicensings"]
  verbs: ["get", "list", "watch", "patch"]

# Pod operations (cluster-wide listing - required for CPFS cert-manager readiness checks)
# Used by: scripts/cpfs/installer_scripts/cp3pt0-deployment/common/utils.sh
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

# OpenShift Project operations (cluster-scoped resource - required for OpenShift environments)
- apiGroups: ["project.openshift.io"]
  resources: ["projects"]
  verbs: ["get", "list"]
---
# ClusterRoleBinding for cluster-scoped resources only
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cp4ba-api.fullname" . }}-cluster-scoped-binding
  labels:
    {{- include "cp4ba-api.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "cp4ba-api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "cp4ba-api.fullname" . }}-cluster-scoped-role
  apiGroup: rbac.authorization.k8s.io
---
# ClusterRole for namespace-scoped resources (uses RoleBindings per namespace)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cp4ba-api.fullname" . }}-namespace-scoped-role
  labels:
    {{- include "cp4ba-api.labels" . | nindent 4 }}
rules:
# ClusterServiceVersion operations (patch needed for CSV backup during upgrade)
- apiGroups: ["operators.coreos.com"]
  resources: ["clusterserviceversions"]
  verbs: ["get", "list", "watch", "patch"]

# Subscription operations (needed for creating IBM Usage Metering subscription)
- apiGroups: ["operators.coreos.com"]
  resources: ["subscriptions"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# CatalogSource operations
- apiGroups: ["operators.coreos.com"]
  resources: ["catalogsources"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# OperatorGroup operations
- apiGroups: ["operators.coreos.com"]
  resources: ["operatorgroups"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Pod operations (cross-namespace access for operator management)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
# Pod exec operations (for reconcile count checks via kubectl exec)
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]

# Secret operations (cross-namespace access for cert-manager and operator management)
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# ConfigMap operations (needed for CPFS namespace-scope ConfigMap reading)
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]

# Deployment operations (cross-namespace access for operator management)
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]

# Deployment scale operations (needed for scaling down operators during upgrade)
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["get", "patch", "update"]

# CP4BA Custom Resources
- apiGroups: ["icp4a.ibm.com"]
  resources: ["icp4aclusters", "contents", "workflows", "cartridges", "bastudios", "processmining", "insights", "odms", "ads", "fncms", "bans", "ums", "insightsengines", "foundations", "foundationrequests", "wfpsruntimes"]
  verbs: ["get", "list", "watch"]

# NetworkPolicy operations (needed for network policy management during upgrade)
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# BAI InsightsEngine operations
- apiGroups: ["bai.ibm.com"]
  resources: ["insightsengines"]
  verbs: ["get", "list", "watch"]

# FNCM operations
- apiGroups: ["fncm.ibm.com"]
  resources: ["fncmclusters"]
  verbs: ["get", "list", "watch"]

# Common Services operations (needed for CPFS upgrade - patching CommonService CR)
- apiGroups: ["operator.ibm.com"]
  resources: ["commonservices"]
  verbs: ["get", "list", "watch", "update", "patch"]

# Cert Manager Config operations (needed for license acceptance in cert-manager namespace)
- apiGroups: ["operator.ibm.com"]
  resources: ["certmanagerconfigs"]
  verbs: ["get", "list", "watch", "patch"]

# IBM Licensing operations (needed for license acceptance in licensing namespace)
- apiGroups: ["operator.ibm.com"]
  resources: ["ibmlicensings"]
  verbs: ["get", "list", "watch", "patch"]

# NamespaceScope operations (needed for CPFS tenant setup)
- apiGroups: ["operator.ibm.com"]
  resources: ["namespacescopes"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]

# OperandRequest operations (needed for CPFS operand management)
- apiGroups: ["operator.ibm.com"]
  resources: ["operandrequests"]
  verbs: ["get", "list", "watch"]

# Role operations (needed for CPFS NSS authorization in operator/operand namespaces)
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]

# RoleBinding operations (needed for CPFS NSS authorization in operator/operand namespaces)
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]

# IBMServiceMeterDefinition operations (needed for IBM Usage Metering metrics)
- apiGroups: ["operator.ibm.com"]
  resources: ["ibmservicemeterdefinitions"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# IBMUsageMetering operations (needed for IBM Usage Metering configuration)
- apiGroups: ["operator.ibm.com"]
  resources: ["ibmusagemeterings"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]

# Zen Services operations
- apiGroups: ["zen.cpd.ibm.com"]
  resources: ["zenservices"]
  verbs: ["get", "list", "watch"]

# Cert-manager operations (needed for certificate management)
- apiGroups: ["cert-manager.io"]
  resources: ["issuers", "certificates", "certificaterequests"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# EnterpriseDB PostgreSQL operations
- apiGroups: ["postgresql.k8s.enterprisedb.io"]
  resources: ["clusters"]
  verbs: ["get", "list", "watch", "patch", "update"]

# Elasticsearch operations (OpenContent)
- apiGroups: ["elasticsearch.opencontent.ibm.com"]
  resources: ["elasticsearchclusters"]
  verbs: ["get", "list", "watch", "patch", "update"]

# Strimzi Kafka operations (IBM Events - needed for Kafka annotation patching during upgrade)
- apiGroups: ["core.ibmevents.ibm.com"]
  resources: ["strimzipodsets"]
  verbs: ["get", "list", "watch", "patch", "update"]
---
# RoleBinding for operand namespace (where API runs)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cp4ba-api.fullname" . }}-operand-binding
  namespace: {{ .Values.serviceAccount.operandNamespace }}
  labels:
    {{- include "cp4ba-api.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "cp4ba-api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "cp4ba-api.fullname" . }}-namespace-scoped-role
  apiGroup: rbac.authorization.k8s.io
---
# RoleBinding for operator namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cp4ba-api.fullname" . }}-operator-binding
  namespace: {{ .Values.serviceAccount.operatorNamespace }}
  labels:
    {{- include "cp4ba-api.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "cp4ba-api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "cp4ba-api.fullname" . }}-namespace-scoped-role
  apiGroup: rbac.authorization.k8s.io
---
# RoleBinding for cert-manager namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cp4ba-api.fullname" . }}-certmanager-binding
  namespace: {{ .Values.serviceAccount.certManagerNamespace }}
  labels:
    {{- include "cp4ba-api.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "cp4ba-api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "cp4ba-api.fullname" . }}-namespace-scoped-role
  apiGroup: rbac.authorization.k8s.io
---
# RoleBinding for marketplace namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cp4ba-api.fullname" . }}-marketplace-binding
  namespace: {{ .Values.serviceAccount.marketplaceNamespace }}
  labels:
    {{- include "cp4ba-api.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "cp4ba-api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "cp4ba-api.fullname" . }}-namespace-scoped-role
  apiGroup: rbac.authorization.k8s.io
---
# RoleBinding for openshift-operators namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cp4ba-api.fullname" . }}-openshiftoperators-binding
  namespace: {{ .Values.serviceAccount.openshiftOperatorsNamespace }}
  labels:
    {{- include "cp4ba-api.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "cp4ba-api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "cp4ba-api.fullname" . }}-namespace-scoped-role
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.serviceAccount.certManagerOperatorNamespace }}
---
# RoleBinding for cert-manager-operator namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cp4ba-api.fullname" . }}-certmanageroperator-binding
  namespace: {{ .Values.serviceAccount.certManagerOperatorNamespace }}
  labels:
    {{- include "cp4ba-api.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "cp4ba-api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "cp4ba-api.fullname" . }}-namespace-scoped-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
# RoleBinding for ibm-licensing namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cp4ba-api.fullname" . }}-ibmlicensing-binding
  namespace: {{ .Values.serviceAccount.ibmLicensingNamespace }}
  labels:
    {{- include "cp4ba-api.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "cp4ba-api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "cp4ba-api.fullname" . }}-namespace-scoped-role
