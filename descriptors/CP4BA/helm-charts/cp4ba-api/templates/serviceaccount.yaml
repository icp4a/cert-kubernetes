# RoleBinding for kube-system namespace (for cluster info ConfigMaps)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cp4ba-api.fullname" . }}-kubesystem-binding
  namespace: {{ .Values.serviceAccount.kubeSystemNamespace }}
  labels:
    {{- include "cp4ba-api.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
